# Crows Playtest 2 -- the Miasma global rule
#
# The imported rule was still Playtest 1 in two ways that mattered:
#
#   1. It fired "every 24 hours". Playtest 2 moves the test to the end of every
#      rest a human spends in the Miasma. The tracker already fires the trigger
#      from FinishRest; only this text lagged.
#   2. It inflicted BONED on tiers 1 AND 2. Boned was retired in stage 2 and
#      split into Weakened and Vulnerable, so the rule was handing out a
#      condition that no longer exists. Playtest 2 replaces it outright: tier 1
#      gives a level of cruelty and a roll on the Miasma Effects table, and
#      tier 2 is simply no effect.
#
# Two further changes:
#
#   * The roll drops its automatic Endurance skill bonus. In Playtest 2 an
#     expertise is a spendable use, not a passive bonus -- the same reason
#     stage 4 stopped attack rolls adding a weapon skill. Endurance can still be
#     spent on this test; it just is not free.
#   * The roll subtracts Trigger Value, which the tracker fills with the crow's
#     current cruelty: "For each level of cruelty you have, you take a -1
#     penalty to RRs against the Miasma." Trigger Value is a registered
#     GoblinScript symbol on custom triggers (TriggeredAbility.lua:662), so the
#     penalty rides the trigger rather than needing a custom attribute.
#
# Emitted from the live record: import REPLACES the whole entry.
_table: globalRuleMods
__typeName: GlobalRuleMod
id: c588e500-f7c3-42eb-9f11-121053a14dc1
name: Miasma
_migrated_apply: true
modifierInfo:
  __typeName: ClassLevel
  features:
    - __typeName: CharacterFeature
      name: Miasma Check
      description: >-
        At the end of every rest a human spends within the Miasma, they must make a
        Miasma Check (2d10 + Mind, minus 1 per level of cruelty they have). Tier 1:
        they gain a level of cruelty and roll on the Miasma Effects table. Tier 2:
        no effect. Tier 3: they remove all levels of cruelty they have, or they
        improve the result of one other human who rested with them by a tier.
        Finishing a rest in the Miasma also restores no expertise uses.
      guid: 746acaeb-568c-45c6-ba9d-a088ef8aaf29
      implementation: 3
      source: Miasma Global Rule Mod Feature
      modifiers:
        - __typeName: CharacterModifier
          behavior: trigger
