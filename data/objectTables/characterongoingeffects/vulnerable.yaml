# Crows Playtest 2 -- Vulnerable
#
# The Rules, p.12 (Conditions):
#   "While you are vulnerable, each time you take damage you take an additional
#    1d6 dam. You lose this condition at the end of a dungeon turn."
#
# Vulnerable is one half of the pair that replaced Boned (the other is
# Weakened). It does not stack -- Playtest 2 adds "You can't gain a second
# instance of a condition you already have".
#
# CrowdexInventory adds the 1d6 at the common damage entry point, so attacks,
# hazards, falls, and damage absorbed by armor all use the same rule. The
# Dungeon Turn custom trigger removes this condition automatically.
