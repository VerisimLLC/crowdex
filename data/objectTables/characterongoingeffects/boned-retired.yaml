# Crows Playtest 2 -- Boned (RETIRED)
#
# Boned no longer exists. Playtest 2 replaced it with two separate, non-stacking
# conditions: Weakened (a bane on all tests) and Vulnerable (+1d6 on damage
# taken). The Playtest 1 machinery it depended on is gone too -- there are no
# condition levels any more, and nothing cancels 1-to-1 against Blessed.
#
# This entry is retired rather than deleted so that any crow, monster or saved
# encounter still referencing the id resolves to something valid instead of
# breaking. Two things happen here:
#
#   hidden: true   removes it from the conditions picker (the panel's add menu
#                  iterates with unhidden_pairs, so hidden entries vanish from
#                  the list without disturbing anything holding the id).
#   modifiers: []  strips the -1-per-level test penalty and the per-level extra
#                  damage, so a lingering application is inert rather than
#                  quietly applying deleted rules. The old formulas referenced
#                  Stacks("Blessed"), which no longer means anything now that
#                  Blessed does not stack.
