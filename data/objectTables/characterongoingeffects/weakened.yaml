# Crows Playtest 2 -- Weakened
#
# The Rules, p.12 (Conditions):
#   "While you are weakened, you take a bane on all tests. You lose this
#    condition at the end of a dungeon turn."
#
# Weakened is one half of the pair that replaced Boned in Playtest 2 (the other
# is Vulnerable). It does not stack: Playtest 2 adds the blanket rule "You can't
# gain a second instance of a condition you already have."
#
# Test, opposed-test, and resistance-test modifiers cover every Crows test
# without incorrectly penalizing attacks. The Dungeon Turn custom trigger
# removes this condition automatically.
