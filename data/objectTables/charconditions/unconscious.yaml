name: Unconscious
implementation: 3
description: >-
  You are asleep, prone, and have speed 0. You cannot take actions, maneuvers, or reactions.
  Agility and Strength tests are automatically doom results. Mind tests to notice your surroundings
  have a double bane. Attacks against you always achieve tier 3. Taking any damage or being within
  10 squares of a loud noise wakes you and ends this condition.
