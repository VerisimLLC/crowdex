name: Grabbed
implementation: 3
description: >-
  Your speed is 0, you cannot flank, and attacks against you gain an edge. You move with your
  grabber. A grab ends if the grabber lets go, dies, becomes prone or unconscious, or moves
  beyond the grabbing effect's range. You can use the Escape Grab maneuver to break free.
