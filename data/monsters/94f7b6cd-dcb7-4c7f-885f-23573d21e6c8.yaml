      implementation: 3
      source: Trait
      modifiers: {}
      domains:
        CharacterFeature:cf360ddc-c5f3-4482-810d-7c88836eab8b: true
      implementationDetails: Deliberately manual. Crows weakened is an ongoing effect -- a bane on all tests --
        and is not the Draw Steel condition of the same name, which is a damage reduction. Writing "weakened" into
        the tier text would apply the wrong one. Apply the Crows Weakened effect to the target.
