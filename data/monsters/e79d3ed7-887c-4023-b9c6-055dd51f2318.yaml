    - __typeName: CharacterFeature
      name: Lacerate
      description: When the undead hits with their claws against a creature and damages their Stamina or gives them
        a wound, the target gains a laceration until they regain Stamina. When the target takes a maneuver and an
        action on their turn, they take 1 P damage for each laceration they have.
      guid: 6e226a37-30b0-4ef0-9b24-ca7ddd973eb3
      implementation: 1
      source: Trait
      modifiers: {}
      domains:
        CharacterFeature:6e226a37-30b0-4ef0-9b24-ca7ddd973eb3: true
      implementationDetails: 'Lacerations stack and are tracked by hand: the engine has no repeatable per-instance
        damage effect. Note this fires on any hit, unlike the undead A version, which needs a tier 3.'
