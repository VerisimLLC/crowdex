    - __typeName: CharacterFeature
      name: Exploding Mote (2/Day)
      description: 'As an action, the undead hurls a chunk of their flesh that explodes into gas in a 4 cube within
        10 squares of them. Each non-undead creature in the area makes a Strength resistance roll: 11 or less 15
        damage; 12-16 7 damage; 17+ no effect.'
      guid: 4aaf0467-343e-4355-ba9c-87516cbdb7b9
      implementation: 1
      source: Trait
      modifiers: {}
      domains:
        CharacterFeature:4aaf0467-343e-4355-ba9c-87516cbdb7b9: true
      implementationDetails: Resistance rolls are rolled by each target and adjudicated by the Ref.
    - __typeName: CharacterFeature
      name: Glorp Through (3/Day)
      description: As a maneuver, the undead moves their speed without provoking opportunity attacks and while entering
        other creatures' spaces at no speed penalty. Each creature whose space they enter takes 1d6 damage. If they
        end this movement in another creature's space, the undead slides the creature into the nearest unoccupied
        space of their choice.
      guid: 98ee3510-4e8c-4539-9de8-11c5bb7cf120
      implementation: 1
      source: Trait
      modifiers: {}
      domains:
        CharacterFeature:98ee3510-4e8c-4539-9de8-11c5bb7cf120: true
    - __typeName: CharacterFeature
      name: Liquid Death
