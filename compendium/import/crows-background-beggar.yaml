# Crows Playtest 2 -- background: Beggar
#
# Rewritten for the August-September 2026 playtest. Three features change:
#   Characteristics -- Playtest 2 sets one characteristic to 2 and lets the
#     other two be a 1 and a 0, or a -1 and a 2, assigned either way round.
#     Playtest 1 started everything at 0 and raised one to +1.
#   Skills -> Expertises -- the proficiency grant becomes resource grants,
#     because an expertise is a spendable pool of uses, not a flat bonus.
#   Stamina -- taken from the Playtest 2 entry.
#
# Trait and Equipment are carried through verbatim. Equipment changed for
# most backgrounds in Playtest 2, but several of the new items do not exist
# in tbl_Gear yet, so that belongs with the inventory-card pass.
