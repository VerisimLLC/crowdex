  - __typeName: CharacterFeature
    name: "Trait: More for Less"
    description: "Leverage trait. When you roll a UD for a piece of mundane equipment that has only 1 die remaining at the start of rolling the item's dice, then you can only lose the UD on a result of 1. (The background lists this trait's tree as Scavenging; in this booklet the trait appears in the Leverage tree.)"
    guid: 2e2d355f-607f-4242-bb21-d2479736c3c1
    implementation: 1
    source: "Beggar Career Feature"
    modifiers: []
