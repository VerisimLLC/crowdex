# Crows Playtest 2 -- Vulnerable
#
# The Rules, p.12 (Conditions):
#   "While you are vulnerable, each time you take damage you take an additional
#    1d6 dam. You lose this condition at the end of a dungeon turn."
#
# Vulnerable is one half of the pair that replaced Boned (the other is
# Weakened). It does not stack -- Playtest 2 adds "You can't gain a second
# instance of a condition you already have".
#
# HOW THE 1d6 WORKS
# The modifier is carried by the vulnerable creature but applies on
# enemy_ability_power_roll ("Enemy Ability Rolls vs Us"), so it surfaces on the
# ATTACKER's roll dialog as a checkbox, defaulted on by activationCondition.
# The attacker ticks it and rolls the d6 as part of their damage -- which is the
# right place for it, since Crows prints static per-tier damage and has no
# damage roll of its own for a d6 to ride along with.
#
# damageModifierType "none" means "add to existing damage". The splice lives in
# MCDModifyPowerRolls.lua (ApplyToRollProperties): EvalGoblinScript returns the
# string "1d6" rather than reducing it, safe_toint("1d6") is nil, so the numeric
# branch is skipped and the text branch rewrites the tier as "3 + 1d6 damage".
# Crows weapon abilities generate their tiers as string.format("%d damage", t)
# in CrowdexInventory.lua, so they match the splice regex.
#
# Do not be tempted to "fix" this to a flat number. An earlier draft used 3 (the
# average of 1d6) on the belief that the field could not hold dice -- that came
# from reading the DISPLAY path (MCDMActivatedAbility.lua, which safe_toints the
# value) rather than the application path above. Dice work here.
