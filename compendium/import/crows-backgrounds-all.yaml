# Crows Playtest 2 -- all 36 backgrounds (Stage 4 / W10)
#
# Each background's Characteristics, Stamina and Expertises features are
# rewritten for the August-September 2026 playtest; Trait and Equipment are
# carried through verbatim from the existing entries.
#
# Characteristics: Playtest 2 sets one characteristic to 2 and lets the other
# two be a 1 and a 0, or a -1 and a 2, assigned either way round -- so a fixed
# primary yields 4 options, "X or Y" yields 8, and "Any" yields 12.
#
# Expertises replace skills: a spendable pool of uses rather than a flat bonus,
# granted with `behavior: resource` + resourceType + num.
#
# Three entries in the book still name retired Playtest 1 skills, folded here
# into their Playtest 2 expertise: the Alchemist's Sabotage and the Merchant's
# Sleight of Hand both become Thievery, and the Keraunomancer's "Blacksmith"
# is Blacksmithing.
