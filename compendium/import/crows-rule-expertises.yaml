# Crows Playtest 2 -- the expertise spend (W9)
#
# One after-roll chip per expertise. Rolling a test offers the crow's own
# general expertises; a casting or weapon attack offers their spellcasting and
# weapon ones. Clicking a chip raises the result one tier and spends one use.
#
# Three fields carry the whole mechanism, and each is load-bearing:
#
#   resourceCostType: none    The legacy named-resource cost is charged ONLY
#                             while the modern cost enum is inactive. Any other
#                             value here and the expertise is never billed.
#   activationAfterRoll: "0"  Must be a STRING or the chip is never offered at
#                             all; falsy so it arrives UNCHECKED, because
#                             spending an expertise is the player's choice.
#   displayAfterRoll          Hides the chip from crows without that expertise.
#                             Without it, all eighteen general expertises show
#                             on every test.
#
# Import REPLACES the whole record.
_table: globalRuleMods
