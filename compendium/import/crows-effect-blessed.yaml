# Crows Playtest 2 -- Blessed (rework of the Playtest 1 stacking version)
#
# The Rules, p.12 (Conditions):
#   "While you are blessed, you gain an edge on all tests and attacks you make
#    deal additional damage equal to the characteristic used to make the attack.
#    You lose this condition at the end of a dungeon turn."
#
# WHAT CHANGED FROM PLAYTEST 1
# Playtest 1 Blessed was a stacking level: +1 per level to all tests, +1 per
# level to damage, cancelling 1-to-1 against Boned. Playtest 2 deletes Boned,
# drops the levels, and restates the bonus as an edge plus characteristic damage.
# So both modifiers are rewritten and stackable flips to false -- Playtest 2 adds
# "You can't gain a second instance of a condition you already have."
#
# The id and guid are deliberately preserved so any crow already carrying the
# condition, and anything referencing it, keeps working.
#
# ONE APPROXIMATION, FLAGGED. "Damage equal to the characteristic used to make
# the attack" has no symbol -- there is no "characteristic used for this roll"
# in GoblinScript. "Highest Characteristic" is used instead. It is exactly right
# whenever a crow attacks with their best characteristic, which is the normal
# case: Crows attacks read "2d10 + A or S" with the player choosing, and spell
# attacks use Mind, which is a caster's strong stat. It over-rewards only a crow
# who deliberately attacks with their weaker characteristic. To drop the
# approximation instead, delete the second modifier and note the bonus in the
# description.
