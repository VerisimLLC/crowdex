# Crows Playtest 2 -- gear changes (Stage 6 / W19)
#
# Weapon retunes, ammunition on usage dice, renames, the coin stack cap, the
# retired bedroll, craft prerequisites restated as expertise uses, craft
# materials restated as generic parts, the crafting-material size ladder
# collapsed into Bar / Log / Monster Part, and eleven new cards.
#
# The magic items among the new cards -- the Death and Life Rings, the Necklace
# of Teeth, the Hurling Wand, the Whistle of Dog Summoning and the Plague Mask --
# are NOT here. They occupy magic item slots, which the module does not model
# yet, so they would import as decorative text.
